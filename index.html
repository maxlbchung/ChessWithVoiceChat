<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1e2c" />
    <title>Voice Chat Chess — peer-to-peer chess with voice chat</title>
    <meta
      name="description"
      content="Six flavors of chess played browser-to-browser over WebRTC, with voice chat. No accounts, no server in the middle of your game."
    />
    <meta property="og:title" content="Voice Chat Chess" />
    <meta
      property="og:description"
      content="Six flavors of chess played browser-to-browser over WebRTC, with voice chat. No accounts, no server in the middle of your game."
    />
    <meta property="og:type" content="website" />
    <!-- Standalone info page. No app bundle, no router, no shared chrome —
         the game itself lives at /app/ (see app/index.html). -->
    <script>
      // The app used to be served from the site root, so hash-routed links to
      // it (shared join links, bookmarks, /#/sandbox) are still out in the
      // wild. Forward those to /app/ instead of showing them this page.
      if (location.hash.startsWith('#/')) location.replace('app/' + location.hash);
    </script>
    <!-- Same three faces as the app (see app/index.html): Newsreader display,
         Archivo body, IBM Plex Mono for dates/data. Fonts are the only network
         request on this page — it still ships with no JS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap"
    />
    <link rel="stylesheet" href="./landing/landing.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="masthead">
      <span class="wordmark"><span class="wordmark-mark">&#9822;</span> VCC</span>
    </header>

    <main>
      <!-- ── Hero ─────────────────────────────────────────────────────── -->
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow reveal" style="--d: 0ms">
            Peer&#8209;to&#8209;peer &nbsp;·&nbsp; voice chat &nbsp;·&nbsp; no accounts
          </p>
          <h1 class="hero-title reveal" style="--d: 70ms">
            Voice&nbsp;Chat
            <em>Chess</em>
          </h1>
          <p class="hero-tagline reveal" style="--d: 140ms">
            Chess with voice chat, new variants, and more.
          </p>
          <div class="cta-row reveal" style="--d: 210ms">
            <a class="btn-primary" href="app/">
              <span>Start playing</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14m0 0-5.5-5.5M18 12l-5.5 5.5"/></svg>
            </a>
          </div>
        </div>

        <div class="hero-board reveal" style="--d: 200ms" aria-hidden="true">
          <div class="board">
            <span class="glyph knight">&#9822;</span>
            <span class="glyph queen">&#9819;</span>
            <span class="glyph pawn">&#9823;</span>
          </div>
          <div class="board-glow"></div>
        </div>
      </section>

      <!-- ── Announcements ────────────────────────────────────────────── -->
      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Announcements</h2>
          <p class="section-sub">What landed recently.</p>
        </div>

        <!-- Cards below are generated at dev/build time from the list in
             landing/announcements.ts by the `landing-announcements` plugin in
             vite.config.ts. Add announcements there, not here — this marker is
             the only thing that belongs in this file. -->
        <!--announcements-->
      </section>

    </main>

    <footer class="footer">
      <span>LiboDev</span>
    </footer>
  </body>
</html>
