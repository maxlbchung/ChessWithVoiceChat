<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 12" preserveAspectRatio="none">
  <!-- A hand-drawn pen rule: one confident stroke, plus a fainter second pass
       that drifts off it, the way a sketched underline doubles back. -->
