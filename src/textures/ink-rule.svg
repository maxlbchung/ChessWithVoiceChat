  <path d="M8 8.2 C 120 6.6, 240 8.8, 360 7.2 S 520 6.8, 590 8.4" fill="none" stroke="#2d2620" stroke-opacity="0.22" stroke-width="1" stroke-linecap="round"/>
</svg>
