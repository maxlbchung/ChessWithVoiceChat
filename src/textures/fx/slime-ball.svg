<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Slime ball: a droplet of sap-green water painted over the slime king.
       Translucent body (the king shows through, tinted), pigment settling to
       the bottom, a darker pooled rim, an ink outline, and highlights left as
       bare paper, the watercolor way to paint light. A small puddle wash
       grounds it. Plain gradients and paths only: no filters. -->
  <defs>
    <radialGradient id="body" cx="0.42" cy="0.36" r="0.68">
      <stop offset="0" stop-color="#c6dc9a" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#8fbb62" stop-opacity="0.42"/>
      <stop offset="0.86" stop-color="#5d9447" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3f7a3c" stop-opacity="0.7"/>
    </radialGradient>
    <linearGradient id="settle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#3f7a3c" stop-opacity="0"/>
      <stop offset="1" stop-color="#2f6a34" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <ellipse cx="51" cy="92" rx="36" ry="6" fill="#5d9447" opacity="0.28"/>
