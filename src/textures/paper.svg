<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
  <!-- Cold-press paper tooth: fine fibres + a coarse mottle, as sepia speckle. -->
  <filter id="p">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="4" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.32  0 0 0 0 0.25  0 0 0 0 0.18  0 0 0 -1.6 1.05"/>
  </filter>
  <rect width="240" height="240" filter="url(#p)" opacity="0.5"/>
</svg>
