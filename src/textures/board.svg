<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Board wash: uneven pigment density (blooms where the wash pooled). No
       paper tooth: the overlay is plain alpha and sits above the pieces, so
       grain would speckle the black ones. Laid over the flat square
       colors so the board reads as painted rather than filled. Rasterized
       once per page by src/lib/watercolor.ts. -->
  <filter id="b" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="9" stitchTiles="stitch" result="bloom"/>
    <feColorMatrix in="bloom" type="matrix" values="0 0 0 0 0.25  0 0 0 0 0.2  0 0 0 0 0.16  0 0 0 0.9 -0.32" result="m"/>
    <feMerge><feMergeNode in="m"/></feMerge>
  </filter>
  <rect width="400" height="400" filter="url(#b)"/>
</svg>
