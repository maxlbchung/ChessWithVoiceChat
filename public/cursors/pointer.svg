<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Click target — a bold X. Two crossed strokes with a black halo
       underneath and a white core on top, so the mark reads against
       any background. Hotspot at the centre (12, 12). -->
  <g stroke-linecap="round">
    <path d="M 5 5 L 19 19 M 19 5 L 5 19"
          stroke="#000000" stroke-width="5"/>
    <path d="M 5 5 L 19 19 M 19 5 L 5 19"
          stroke="#ffffff" stroke-width="2.6"/>
  </g>
</svg>
