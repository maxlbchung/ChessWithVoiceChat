<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The app is a fixed sheet, not a zoomable document: pinch/double-tap
         zoom would fight board drags and leave players stuck zoomed-in.
         iOS Safari ignores user-scalable=no — main.tsx blocks its gesture
         events as the backstop. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4ecdc" />
    <title>VCC</title>
    <!-- Type system ("Sketchbook"): one hand-lettered family, Shantell Sans,
         for all three roles — display (loosest, via the INFM/BNCE axes), UI
         body (tamer), and notation & data (tabular figures). Mirrored in
         landing/landing.css. Local stacks in --font-* cover the offline case. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght,BNCE,INFM@300..800,-100..100,0..100&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
