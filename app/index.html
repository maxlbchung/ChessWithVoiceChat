<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The app is a fixed sheet, not a zoomable document: pinch/double-tap
         zoom would fight board drags and leave players stuck zoomed-in.
         iOS Safari ignores user-scalable=no — main.tsx blocks its gesture
         events as the backstop. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4ecdc" />
    <title>VCC</title>
    <!-- Type system ("Sketchbook"): Caveat = hand-lettered display, Nunito =
         UI body, Courier Prime = notation & data (clocks, ratings, coords,
         moves). Mirrored in landing/landing.css so the two documents read as
         one product. Local stacks in --font-* cover the offline case. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Courier+Prime:wght@400;700&family=Nunito:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
