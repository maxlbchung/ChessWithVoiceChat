<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08151f" />
    <title>VCC</title>
    <!-- Type system ("Bulletin"): Newsreader = display/editorial, Archivo = UI
         body, IBM Plex Mono = notation & data (clocks, ratings, coords, moves).
         Newsreader is a reading face — it carries the editorial voice with far
         less stroke contrast than a didone, which went thin and hard to read at
         heading sizes. Mirrored in landing/landing.css so the two documents
         read as one product. Local stacks in --font-* cover the offline case. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
